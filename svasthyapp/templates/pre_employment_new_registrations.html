<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pre-Employment New Registrations Received.</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 0;
      color: #333333;
      -webkit-font-smoothing: antialiased;
    }

    .email-container {
      max-width: 650px;
      margin: 25px auto;
      background-color: #ffffff;
      padding: 35px 30px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
    }

    .header {
      text-align: center;
      border-bottom: 3px solid #64ce46;
      padding-bottom: 18px;
      margin-bottom: 25px;
    }

    .header img {
      height: 55px;
      margin-bottom: 5px;
    }

    p {
      line-height: 1.65;
      margin: 12px 0;
      font-size: 14.5px;
    }

    .message-box {
      background-color: #f8fafc;
      border-left: 4px solid #64ce46;
      border-radius: 6px;
      padding: 16px 20px;
      margin: 20px 0;
      font-size: 14.5px;
      line-height: 1.6;
    }

    .footer {
      margin-top: 28px;
      border-top: 1px solid #e2e8f0;
      padding-top: 18px;
      font-size: 14px;
      color: #475569;
    }

    .system-msg {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      margin-top: 25px;
    }

    @media (max-width: 600px) {
      .email-container {
        padding: 20px 15px;
      }
    }
  </style>
</head>

<body>
  <div class="email-container">
    <div class="header">
      <img src="https://wellness360api.svasthyalife.co.in/media/image/logo.png" alt="Svasthya Logo" />
    </div>

    <p>Dear {{ team_name|default:"Team" }},</p>

    <div class="message-box">
      <p style="margin: 0;">This is to inform you that new registrations received for the pre-employment health checkups.</p>
    </div>

    <div class="footer">
      <p style="margin-bottom: 4px;">Best regards,</p>
      <p style="margin: 0; font-weight: bold; color: #1e293b;">Svasthya Team</p>
      <p style="margin: 2px 0 0 0; color: #475569;">Vakare Management Consultants LLP</p>
    </div>

    <p class="system-msg">This is a system generated email, please do not respond to this email.</p>
  </div>
</body>

</html>
